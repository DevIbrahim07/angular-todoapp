<div class="todo-item" [class.completed]="todo().completed" [class.editing]="isEditing()">
  @if (!isEditing()) {
    <!-- Normal View -->
    <button
      class="checkbox"
      [class.checked]="todo().completed"
      (click)="toggled.emit(todo().id)"
      [attr.aria-label]="'Toggle ' + todo().text"
    >
      @if (todo().completed) {
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      }
    </button>

    <div class="todo-content" (dblclick)="startEdit()">
      <span class="todo-text">{{ todo().text }}</span>
      <div class="todo-meta">
        <span class="priority-badge" [class]="'priority-' + todo().priority">
          {{ getPriorityLabel() }}
        </span>
        <span class="time-ago">{{ getTimeAgo() }}</span>
      </div>
    </div>

    <div class="todo-actions">
      <button
        class="edit-btn"
        (click)="startEdit()"
        title="Edit task"
        [attr.aria-label]="'Edit ' + todo().text"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </button>
      <button
        class="delete-btn"
        (click)="deleted.emit(todo().id)"
        title="Delete task"
        [attr.aria-label]="'Delete ' + todo().text"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  } @else {
    <!-- Edit View -->
    <input
      type="text"
      class="edit-input"
      [value]="editText()"
      (input)="onEditInput($any($event.target).value)"
      (keydown)="onEditKeydown($event)"
      (blur)="saveEdit()"
      autofocus
    />
  }
</div>
